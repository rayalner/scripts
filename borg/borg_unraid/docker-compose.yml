version: '3.8'

# ============================================================
# Borgmatic Docker Compose for Unraid
# ============================================================
# This docker-compose file deploys the borgmatic container
# with all necessary configurations for automated backups.
#
# Usage:
#   1. Place this file in: /mnt/user/appdata/borgmatic/
#   2. Edit the .env file with your settings
#   3. Edit config.yaml with your backup configuration
#   4. Run: docker-compose up -d
#
# Unraid Paths:
#   - Adjust volume mounts to match your Unraid setup
#   - Default assumes standard Unraid user share structure
# ============================================================

services:
  borgmatic:
    # Official borgmatic container image
    image: b3vis/borgmatic:latest

    container_name: borgmatic

    # Restart policy
    restart: unless-stopped

    # Environment variables
    environment:
      # Timezone (adjust to your location)
      # Find yours at: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ:-America/New_York}

      # Borg passphrase (loaded from .env file)
      - BORG_PASSPHRASE=${BORG_PASSPHRASE}

      # Optional: Borg RSH (for custom SSH settings)
      # - BORG_RSH=ssh -i /root/.ssh/id_ed25519

      # Optional: Prevent relocated repository warnings
      # - BORG_RELOCATED_REPO_ACCESS_IS_OK=no

      # Optional: Unknown unencrypted repository access
      # - BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK=no

    # Volume mounts
    volumes:
      # ========================================
      # SOURCE DATA (what to backup)
      # ========================================
      # Mount your data directories as READ-ONLY (:ro) for safety
      # Adjust these paths to match what you want to backup

      # Docker appdata (most common backup target on Unraid)
      - /mnt/user/appdata:/mnt/source/appdata:ro

      # Add more data sources as needed:
      # - /mnt/user/documents:/mnt/source/documents:ro
      # - /mnt/user/photos:/mnt/source/photos:ro
      # - /mnt/user/important_data:/mnt/source/important_data:ro
      # - /mnt/disk1/media:/mnt/source/media:ro

      # ========================================
      # LOCAL BACKUP REPOSITORY
      # ========================================
      # Where local backups will be stored
      # Choose one of these options:

      # Option 1: User share (backed up to array)
      - /mnt/user/backups/borg-local:/mnt/borg-repository

      # Option 2: Specific disk (faster, doesn't spin up all disks)
      # - /mnt/disk2/backups/borg-local:/mnt/borg-repository

      # Option 3: Cache drive (fast, but limited space)
      # - /mnt/cache/backups/borg-local:/mnt/borg-repository

      # Option 4: Unassigned device (USB drive, etc.)
      # - /mnt/disks/BackupDrive/borg-local:/mnt/borg-repository

      # Note: Comment out if doing remote-only backups

      # ========================================
      # BORGMATIC CONFIGURATION
      # ========================================
      # Borgmatic config files
      - ./config:/root/.config/borgmatic
      # Or if you prefer a single file:
      # - ./config.yaml:/root/.config/borgmatic/config.yaml:ro

      # ========================================
      # SSH KEYS (for remote backups)
      # ========================================
      # SSH keys for remote backups
      - ./ssh:/root/.ssh

      # ========================================
      # BORG CACHE
      # ========================================
      # Borg cache directory (speeds up backups)
      - ./cache/borg:/root/.cache/borg

      # ========================================
      # OPTIONAL: UNRAID NOTIFICATIONS
      # ========================================
      # Uncomment to enable Unraid notification integration
      # - /usr/local/emhttp:/usr/local/emhttp:ro

    # Network mode
    # bridge is recommended for most setups
    network_mode: bridge

    # Optional: Resource limits
    # Uncomment to prevent backups from consuming too many resources
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

    # Optional: Healthcheck
    # Monitors if borgmatic is running correctly
    healthcheck:
      test: ["CMD", "borgmatic", "--version"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

    # Labels (for organization)
    labels:
      - "com.github.borgmatic.description=Automated Borg backups for Unraid"
      - "com.github.borgmatic.version=latest"

# ============================================================
# VOLUMES (optional named volumes)
# ============================================================
# Uncomment if you prefer named volumes instead of bind mounts
# volumes:
#   borgmatic_config:
#   borgmatic_ssh:
#   borgmatic_cache:

# ============================================================
# NETWORKS (optional custom network)
# ============================================================
# Uncomment if you want a custom network
# networks:
#   borgmatic_net:
#     driver: bridge

# ============================================================
# NOTES
# ============================================================
# 1. First-time setup:
#    - Create .env file with BORG_PASSPHRASE
#    - Create config.yaml with your backup settings
#    - Run: docker-compose up -d
#    - Initialize repository: docker exec borgmatic borgmatic init --encryption repokey
#    - Run first backup: docker exec borgmatic borgmatic --verbosity 1 --stats
#
# 2. View logs:
#    docker-compose logs -f
#    docker-compose logs -f --tail 100
#
# 3. Run manual backup:
#    docker exec borgmatic borgmatic --verbosity 1
#
# 4. Stop container:
#    docker-compose down
#
# 5. Update container:
#    docker-compose pull
#    docker-compose up -d
#
# 6. Enter container:
#    docker exec -it borgmatic bash
#
# 7. Export repository key:
#    docker exec borgmatic borg key export /mnt/borg-repository /tmp/repo.key
#    docker cp borgmatic:/tmp/repo.key ./borg-local-repo.key
#
# 8. IMPORTANT: Back up these files offline:
#    - .env (contains passphrase)
#    - borg-local-repo.key (repository key)
#    You need BOTH to recover backups!
