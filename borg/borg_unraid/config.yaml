# ============================================================
# Borgmatic Configuration for Unraid
# ============================================================
# This file controls all aspects of your backup:
# - What to backup (source_directories)
# - Where to backup (repositories)
# - When to backup (cron)
# - How long to keep backups (retention)
# - What to exclude (exclude_patterns)
#
# Edit this file to match your needs, then place it at:
# /mnt/user/appdata/borgmatic/.config/borgmatic/config.yaml
# ============================================================

# ============================================================
# BACKUP SOURCES
# ============================================================
# Directories to include in backups
# These paths are INSIDE the container (mapped via Docker volumes)
source_directories:
  - /mnt/source/appdata          # Maps to your Unraid appdata
  # Add more sources as needed:
  # - /mnt/source/documents
  # - /mnt/source/photos
  # - /mnt/source/important_data

# ============================================================
# REPOSITORIES
# ============================================================
# Where to store backups
# You can have multiple repositories (local + remote)
repositories:
  # Local backup repository
  - path: /mnt/borg-repository
    label: local

  # Remote backup repository (uncomment and configure for remote backups)
  # - path: ssh://backup-user@backup-server.com:22/~/backups/borg-unraid
  #   label: offsite

# ============================================================
# BACKUP SETTINGS
# ============================================================

# Archive name format (uses timestamp + hostname)
# Default creates archives like: 2024-01-15T02-00-00-Tower
archive_name_format: '{now:%Y-%m-%dT%H-%M-%S}-{hostname}'

# Compression algorithm
# Options: none, lz4 (fast), zstd (balanced), zstd,3 (better), lzma,6 (best but slow)
# Recommendation for Unraid: lz4 (fast, low CPU usage)
compression: lz4

# One file system only (don't cross filesystem boundaries)
# Recommended: true for Unraid to avoid backing up /dev, /proc, etc.
one_file_system: true

# Exclude caches (respects CACHEDIR.TAG)
exclude_caches: true

# Exclude if nodump flag is set
exclude_if_present:
  - .nobackup
  - NOBACKUP

# ============================================================
# EXCLUDE PATTERNS
# ============================================================
# Files and directories to exclude from backups
exclude_patterns:
  # Temporary files
  - '*.tmp'
  - '*.temp'
  - '*.log'
  - '*.cache'

  # OS files
  - '.DS_Store'
  - 'Thumbs.db'
  - 'desktop.ini'

  # Common cache directories (adjust for your apps)
  - '*/cache/*'
  - '*/Cache/*'
  - '*/caches/*'
  - '*/logs/*'
  - '*/Logs/*'
  - '*/tmp/*'
  - '*/temp/*'

  # Plex cache (large and rebuilds automatically)
  - '/mnt/source/appdata/plex/Library/Application Support/Plex Media Server/Cache'
  - '/mnt/source/appdata/plex/Library/Application Support/Plex Media Server/Logs'

  # Add app-specific exclusions here:
  # - '/mnt/source/appdata/your-app/big-cache-folder'

# ============================================================
# RETENTION POLICY
# ============================================================
# How long to keep backups
# Borg will automatically prune old backups according to this policy
retention:
  # Keep all backups within this time period
  keep_within: 14d

  # Keep the last N daily backups
  keep_daily: 7

  # Keep the last N weekly backups (one per week)
  keep_weekly: 4

  # Keep the last N monthly backups (one per month)
  keep_monthly: 6

  # Keep the last N yearly backups (one per year)
  # keep_yearly: 2

# Delete archives after pruning (recommended)
# Set to false to keep deleted archives as "deleted" markers
prefix: '{hostname}-'

# ============================================================
# CONSISTENCY CHECKS
# ============================================================
# Verify repository and archive integrity
consistency:
  # Which checks to run
  checks:
    # Verify repository structure
    - name: repository
      frequency: 2 weeks

    # Verify archive contents (slower, more thorough)
    - name: archives
      frequency: 1 month
      # Only check recent archives (faster)
      # check_last: 3

# ============================================================
# HOOKS
# ============================================================
# Commands to run before/after backups or on errors
hooks:
  # Before backup starts
  before_backup:
    - echo "Starting Borg backup at $(date)"

    # Example: Dump database before backup
    # - docker exec mariadb mysqldump -u root -pPASSWORD --all-databases > /mnt/source/db-backup.sql

    # Example: Stop Docker containers for consistent backup
    # - docker stop plex

  # After successful backup
  after_backup:
    - echo "Borg backup completed successfully at $(date)"

    # Example: Remove database dump
    # - rm -f /mnt/source/db-backup.sql

    # Example: Restart stopped containers
    # - docker start plex

    # Example: Ping healthcheck service
    # - curl -fsS -m 10 --retry 5 https://hc-ping.com/YOUR-UUID-HERE

  # On backup failure
  on_error:
    - echo "ERROR: Borg backup failed at $(date)" >&2

    # Example: Send notification via Unraid API
    # - /usr/local/emhttp/webGui/scripts/notify -s "Backup Failed" -d "Borg backup encountered an error" -i alert

    # Example: Ping healthcheck failure endpoint
    # - curl -fsS -m 10 --retry 5 https://hc-ping.com/YOUR-UUID-HERE/fail

  # Before pruning old archives
  # before_prune:
  #   - echo "Pruning old backups..."

  # After pruning
  # after_prune:
  #   - echo "Prune completed"

  # Before running consistency checks
  # before_check:
  #   - echo "Running repository checks..."

  # After consistency checks
  # after_check:
  #   - echo "Checks completed"

# ============================================================
# SCHEDULING
# ============================================================
# When to run backups (cron format)
# Format: minute hour day month weekday
#
# Examples:
#   "0 2 * * *"      - Every day at 2:00 AM
#   "0 2 * * 0"      - Every Sunday at 2:00 AM
#   "0 2 1,15 * *"   - 1st and 15th of month at 2:00 AM
#   "0 2 1 * *"      - 1st of each month at 2:00 AM
#   "0 */6 * * *"    - Every 6 hours
#
# Use https://crontab.guru/ to generate schedules
#
cron:
  # Default: 1st and 15th of every month at 2 AM
  - "0 2 1,15 * *"

  # For multiple schedules, add more entries:
  # - "0 2 * * *"    # Daily at 2 AM
  # - "0 4 * * 0"    # Weekly (Sunday) at 4 AM

# ============================================================
# STORAGE SETTINGS
# ============================================================

# Borg cache directory (speeds up backups)
# This is automatically configured via Docker volume mount
# No need to change unless you have specific requirements

# Lock wait time (how long to wait if repository is locked)
lock_wait: 5

# Umask for created files
# umask: 0077

# ============================================================
# SSH SETTINGS (for remote backups)
# ============================================================
# These are optional - only needed if using SSH repositories
# SSH keys should be placed in: /mnt/user/appdata/borgmatic/.ssh/

# SSH command to use
# ssh_command: ssh -i /root/.ssh/id_ed25519

