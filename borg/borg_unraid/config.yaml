# ============================================================
# ADVANCED OPTIONS
# ============================================================

# Numeric repository ID (for multi-repo setups)
# repository_id: 1

# Extra Borg create arguments
# extra_borg_options:
#   create: --stats --progress

# Relocated repository access
# relocated_repo_access_is_ok: false

# Unknown unencrypted repository access
# unknown_unencrypted_repo_access_is_ok: false

# ============================================================
# EXAMPLE CONFIGURATIONS
# ============================================================

# Example 1: Minimal local-only backup
# ------------------------------------------------------------
# repositories:
#   - path: /mnt/borg-repository
# source_directories:
#   - /mnt/source/appdata
# retention:
#   keep_daily: 7
# cron:
#   - "0 3 * * *"

# Example 2: Local + Remote with different schedules
# ------------------------------------------------------------
# Create two separate config files:
# - local.yaml  (daily backups to local repository)
# - remote.yaml (weekly backups to remote repository)

# Example 3: Multiple sources, aggressive pruning
# ------------------------------------------------------------
# source_directories:
#   - /mnt/source/appdata
#   - /mnt/source/documents
#   - /mnt/source/photos
# retention:
#   keep_within: 7d
#   keep_daily: 7
#   keep_weekly: 4
#   keep_monthly: 3

# ============================================================
# NOTES
# ============================================================
# 1. After editing this file, restart the container:
#    docker restart borgmatic
#
# 2. Test your configuration:
#    docker exec borgmatic borgmatic --dry-run --verbosity 1
#
# 3. Run a manual backup:
#    docker exec borgmatic borgmatic --verbosity 1 --stats
#
# 4. List existing archives:
#    docker exec borgmatic borgmatic list
#
# 5. Validate this YAML file:
#    docker exec borgmatic borgmatic config validate
#
# 6. IMPORTANT: Export and save repository keys offline!
#    docker exec borgmatic borg key export /mnt/borg-repository /tmp/repo.key
#    docker cp borgmatic:/tmp/repo.key ./borg-local-repo.key
#
# 7. Keep your BORG_PASSPHRASE safe! You need BOTH:
#    - The passphrase (in .env file)
#    - The repository key (exported above)
#    to recover backups.
