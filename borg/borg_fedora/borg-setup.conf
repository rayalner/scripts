# ============================================================
# Borg Backup Setup Configuration
# Edit these values before running borg-setup.sh
# ============================================================

# The directories you want to back up (space-separated list)
# Examples:
#   Single source:  BACKUP_SOURCES="/disk1"
#   Multiple:       BACKUP_SOURCES="/disk1 /home/user/documents /var/www"
#
BACKUP_SOURCES="/disk1"

# Your Borg repository passphrase - make this strong
BORG_PASSPHRASE=changeme

# Compression method: lz4 (fast), zstd,3 (better ratio), lzma,6 (max)
COMPRESSION=lz4

# Retention policy (applies to both repositories)
KEEP_WITHIN=14d        # Keep all backups within this period
KEEP_MONTHLY=4         # Keep this many monthly backups

# ============================================================
# LOCAL BACKUP CONFIGURATION
# ============================================================
ENABLE_LOCAL=yes
LOCAL_REPO=/disk2/backup/borg-local
LOCAL_SCHEDULE_DAYS=1,15   # 1st and 15th of each month
LOCAL_SCHEDULE_TIME=02:00:00

# ============================================================
# REMOTE (SSH) BACKUP CONFIGURATION
# ============================================================
# Set ENABLE_REMOTE=yes and configure the SSH repository below
# Example: user@remote-server.com:/path/to/repo
#          ssh://user@192.168.1.100:22/~/backups/borg-repo
ENABLE_REMOTE=no
REMOTE_REPO=user@remote-server.com:/backups/borg-remote
REMOTE_SCHEDULE_DAYS=1     # 1st of each month
REMOTE_SCHEDULE_TIME=04:00:00
