# ============================================================
# Borg Backup Setup Configuration for Unraid
# Edit these values before running borg-setup.sh
# ============================================================

# The directories you want to back up (space-separated list)
# Common Unraid paths:
#   /mnt/user/appdata    - Docker appdata
#   /mnt/user/shares     - User shares
#   /mnt/disk1           - Specific disk
#
# Examples:
#   Single source:  BACKUP_SOURCES="/mnt/user/appdata"
#   Multiple:       BACKUP_SOURCES="/mnt/user/appdata /mnt/user/documents /mnt/user/photos"
#
BACKUP_SOURCES="/mnt/user/appdata"

# Your Borg repository passphrase - make this strong
BORG_PASSPHRASE=changeme

# Compression method: lz4 (fast), zstd,3 (better ratio), lzma,6 (max)
COMPRESSION=lz4

# Retention policy (applies to both repositories)
KEEP_WITHIN=14d        # Keep all backups within this period
KEEP_MONTHLY=4         # Keep this many monthly backups

# ============================================================
# LOCAL BACKUP CONFIGURATION
# ============================================================
ENABLE_LOCAL=yes
# Typical Unraid local backup locations:
#   /mnt/user/backups/borg-local  - Backup to cache/array
#   /mnt/disk2/backups/borg-local - Backup to specific disk
#   /mnt/disks/USB_Backup/borg    - Backup to unassigned device
LOCAL_REPO=/mnt/user/backups/borg-local

# Cron schedule for local backups
# Format: minute hour day month weekday
# Examples:
#   0 2 1,15 * *   - 2 AM on 1st and 15th of each month
#   0 2 */7 * *    - 2 AM every 7 days
#   0 3 * * 0      - 3 AM every Sunday
LOCAL_CRON_SCHEDULE="0 2 1,15 * *"

# ============================================================
# REMOTE (SSH) BACKUP CONFIGURATION
# ============================================================
# Set ENABLE_REMOTE=yes and configure the SSH repository below
# Example: user@remote-server.com:/path/to/repo
#          ssh://user@192.168.1.100:22/~/backups/borg-repo
ENABLE_REMOTE=no
REMOTE_REPO=user@remote-server.com:/backups/borg-remote

# Cron schedule for remote backups
# Stagger this from local backups to avoid conflicts
# Example: 0 4 1 * * - 4 AM on 1st of each month
REMOTE_CRON_SCHEDULE="0 4 1 * *"
